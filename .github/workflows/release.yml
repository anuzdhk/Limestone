name: Release Build (Windows MSI & macOS DMG)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Tag "v0.3.0-beta" -> VERSION_STRIPPED "0.3.0-beta", NUMERIC_VERSION "0.3.0".
  # Manual runs fall back to the dev label.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-dev' }}

jobs:
  build-windows:
    name: Build Windows MSI Installer
    runs-on: windows-latest
    steps:
      - name: Resolve version
        shell: bash
        run: |
          v="${VERSION#v}"
          echo "VERSION_STRIPPED=$v" >> "$GITHUB_ENV"
          echo "NUMERIC_VERSION=${v%%-*}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p adjust-gui

      - name: Prepare binary directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "bin" -Force
          Copy-Item "target/release/adjust-gui.exe" -Destination "bin/Limestone.exe" -Force

      - name: Build MSI with WiX Toolset
        shell: pwsh
        run: |
          # Pin WiX: v7 requires accepting its OSMF EULA before it will build.
          dotnet tool install --global wix --version 7.0.0
          wix eula accept wix7
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          wix build wix/main.wxs -arch x64 -d ProductVersion=${{ env.NUMERIC_VERSION }} -o "dist/Limestone-${{ env.VERSION_STRIPPED }}-Windows-x64.msi"

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v5
        with:
          name: Limestone-Windows-MSI
          path: dist/Limestone-${{ env.VERSION_STRIPPED }}-Windows-x64.msi

  build-macos:
    name: Build macOS DMG Installer
    runs-on: macos-latest
    steps:
      - name: Resolve version
        shell: bash
        run: |
          v="${VERSION#v}"
          echo "VERSION_STRIPPED=$v" >> "$GITHUB_ENV"
          echo "NUMERIC_VERSION=${v%%-*}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build universal / ARM64 macOS binary
        run: |
          cargo build --release -p adjust-gui --target aarch64-apple-darwin
          cargo build --release -p adjust-gui --target x86_64-apple-darwin

      - name: Assemble macOS .app Bundle and DMG
        run: |
          APP="dist/Limestone.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # Universal Mach-O binary
          lipo -create \
            target/aarch64-apple-darwin/release/adjust-gui \
            target/x86_64-apple-darwin/release/adjust-gui \
            -output "$APP/Contents/MacOS/Limestone"
          chmod +x "$APP/Contents/MacOS/Limestone"

          # Info.plist (unquoted heredoc so the version is filled in)
          cat << EOF > "$APP/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Limestone</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.limestone.studio</string>
              <key>CFBundleName</key>
              <string>Limestone</string>
              <key>CFBundleDisplayName</key>
              <string>Limestone</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${NUMERIC_VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${NUMERIC_VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Convert PNG logo to ICNS
          mkdir -p icon.iconset
          sips -z 16 16     logo/logo.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     logo/logo.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     logo/logo.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     logo/logo.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   logo/logo.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   logo/logo.png --out icon.iconset/icon_128x128@2x.png
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/AppIcon.icns" || true

          # Create DMG image
          mkdir -p dmg_root
          cp -r "$APP" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Limestone" -srcfolder dmg_root -ov -format UDZO "dist/Limestone-${VERSION_STRIPPED}-macOS-Universal.dmg"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: Limestone-macOS-DMG
          path: dist/Limestone-${{ env.VERSION_STRIPPED }}-macOS-Universal.dmg

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        shell: bash
        run: echo "VERSION_STRIPPED=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Checkout repository (for release notes)
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Limestone-Windows-MSI/Limestone-${{ env.VERSION_STRIPPED }}-Windows-x64.msi
            artifacts/Limestone-macOS-DMG/Limestone-${{ env.VERSION_STRIPPED }}-macOS-Universal.dmg
          name: Limestone ${{ env.VERSION_STRIPPED }}
          body_path: RELEASE_NOTES.md
          # Tags with a suffix (e.g. -beta, -rc1) are published as pre-releases.
          prerelease: ${{ contains(env.VERSION_STRIPPED, '-') }}
          generate_release_notes: true
