[workspace]
members = [
    "crates/adjust-core",
    "crates/adjust-cli",
    "crates/adjust-gui",
]
resolver = "2"

[workspace.dependencies]
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
